# The public URL used by both the frontend and PocketBase. Set this explicitly.
# It must match the URL through which users reach Wanderer.
web:
  origin: ""
  replicaCount: 1
  revisionHistoryLimit: 10
  strategy:
    # Recreate avoids two pods mounting a ReadWriteOnce uploads volume during
    # an upgrade. Use RollingUpdate only with shared RWX storage.
    type: Recreate
  image:
    repository: flomp/wanderer-web
    tag: v0.20.0
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: wanderer.example.internal
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    keep: true
    annotations: {}
  config:
    # 100 MiB is an explicit upload budget. Increase it when measured input
    # files require more space and align the ingress proxy limit with it.
    bodySizeLimit: "104857600"
    # Must be reachable by both the browser and the web pod. If PocketBase is
    # exposed through a separate hostname, set that URL explicitly.
    publicPocketbaseURL: ""
    disableSignup: true
    privateInstance: true
    mapMaxPolylines: 100
    valhallaURL: https://valhalla1.openstreetmap.de
    nominatimURL: https://nominatim.openstreetmap.org
    overpassURL: https://overpass-api.de
  extraEnv: []
  extraEnvFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  terminationGracePeriodSeconds: 30
  startupProbe:
    enabled: true
    type: http
    path: /
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    type: tcp
    path: /
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    type: http
    path: /
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

database:
  replicaCount: 1
  image:
    repository: flomp/wanderer-db
    tag: v0.20.0
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8090
    annotations: {}
  # The frontend needs a browser-reachable PocketBase URL. This optional
  # ingress exposes the database service; protect /_/ with your ingress policy.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: wanderer-pb.example.internal
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      keep: true
      annotations: {}
    plugins:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      keep: true
      annotations: {}
  config:
    cronSyncSchedule: "0 2 * * *"
    smtp:
      enabled: false
      senderAddress: ""
      senderName: ""
      host: ""
      port: ""
      username: ""
      password:
        existingSecret: ""
        key: smtp-password
  extraEnv: []
  extraEnvFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  terminationGracePeriodSeconds: 30
  startupProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

search:
  replicaCount: 1
  image:
    repository: getmeili/meilisearch
    tag: v1.36.0
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 7700
    annotations: {}
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    keep: true
    annotations: {}
  config:
    environment: production
    noAnalytics: true
  extraEnv: []
  extraEnvFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  terminationGracePeriodSeconds: 30
  startupProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    type: http
    path: /health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

garminSync:
  # Disabled by default. Enable only after creating the required API-token
  # Secret and, for Garmin Connect, the credential Secret.
  enabled: false
  schedule: "0 */6 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A failed route remains absent from the manifest, so a restarted Job
  # resumes only the unfinished work. Four retries allow recovery from short
  # Garmin/Wanderer outages without creating overlapping Jobs.
  backoffLimit: 4
  # A large account run can take several hours. This six-hour budget leaves
  # room for bounded route retries.
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  image:
    repository: ghcr.io/nabsku/wanderer-garmin-sync
    tag: "0.2.3" # x-release-please-version
    digest: ""
    pullPolicy: IfNotPresent
  sources:
    garminConnect:
      enabled: false
      secret:
        existingSecret: ""
        emailKey: garmin-email
        passwordKey: garmin-password
      # Keep the original FIT file, or use Garmin's GPX export.
      downloadFormat: original
      pageSize: 1000
      maxPages: 2000
    officialExport:
      enabled: false
  # Keep the original FIT file when uploading. Use gpx only if required.
  fitMode: preserve
  wanderer:
    url: ""
    existingSecret: ""
    tokenKey: api-token
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    keep: true
    annotations: {}
  limits:
    maxFileBytes: 268435456
    maxZipMembers: 10000
    maxZipUncompressedBytes: 2147483648
  # The upload path may wait for Wanderer's elevation/geocoding dependencies.
  requestTimeoutSeconds: 180
  # Per-route retries apply only to network failures and HTTP 408/425/429/5xx.
  # Permanent 4xx responses fail immediately and are retried by a later Job
  # only after the operator fixes the underlying configuration.
  uploadRetries: 3
  retryBackoffSeconds: 5
  retryMaxBackoffSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

secret:
  # Leave empty to create a namespaced Secret. Values are generated at install
  # time and retained across upgrades through Helm lookup. For GitOps, prefer
  # existingSecret and manage it through an external secret manager.
  existingSecret: ""
  name: ""
  keys:
    pocketbaseEncryption: pocketbase-encryption-key
    meiliMaster: meili-master-key
  pocketbaseEncryptionKey: ""
  meiliMasterKey: ""
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

networkPolicy:
  enabled: false
  # These are raw NetworkPolicy peers/egress rules for the web pod. When this
  # is enabled, the ingress controller or trusted clients must be listed here.
  webIngress: []
  webEgress: []
  databaseEgress: []
  searchEgress: []
  # When NetworkPolicy is enabled, these raw egress rules permit the sync job
  # to reach Garmin Connect. Use the narrowest rules supported by the CNI.
  garminSyncEgress: []

commonLabels: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
