apiVersion: v2
name: wanderer
description: Helm chart for the self-hosted Wanderer trail catalogue.
type: application
version: 0.2.1
appVersion: "0.20.0"
kubeVersion: ">=1.25.0-0"
icon: https://raw.githubusercontent.com/open-wanderer/wanderer/v0.20.0/web/static/svgs/logo_text_two_line_dark.svg
home: https://wanderer.to/
sources:
  - https://github.com/open-wanderer/wanderer
keywords:
  - gps
  - gpx
  - trails
  - maps
  - self-hosted
maintainers:
  - name: Nabsku
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/Nabsku/wanderer-helm#readme
    - name: Support
      url: https://github.com/Nabsku/wanderer-helm/issues
  artifacthub.io/changes: |
    - kind: changed
      description: Improved chart documentation and package metadata.
      links:
        - name: Repository
          url: https://github.com/Nabsku/wanderer-helm
  artifacthub.io/images: |
    - name: Wanderer web
      image: flomp/wanderer-web:v0.20.0
    - name: Wanderer database
      image: flomp/wanderer-db:v0.20.0
    - name: Meilisearch
      image: getmeili/meilisearch:v1.36.0
