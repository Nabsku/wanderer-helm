name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Merged Knope release-preview commit SHA to publish or repair
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CHART_DIR: charts/wanderer

jobs:
  release:
    if: (github.event_name == 'pull_request' && github.head_ref == 'knope/release' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint short-lived release automation token
        id: automation-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID || secrets.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.automation-token.outputs.token }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render-test dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Install synchronizer dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r sync/requirements.txt

      - name: Run chart tests
        run: tests/render.sh

      - name: Run synchronizer unit tests
        env:
          PYTHONPATH: sync
        run: python -m unittest discover -s tests/sync -v

      - name: Run automation unit tests
        run: python -m unittest discover -s tests -p 'test_update_wanderer_upstream.py' -v

      - name: Check chart and synchronizer versions
        id: version
        run: |
          set -euo pipefail
          version="$(python -c 'import yaml; print(yaml.safe_load(open("charts/wanderer/Chart.yaml"))["version"])')"
          sync_image_version="$(python -c 'import yaml; print(yaml.safe_load(open("charts/wanderer/values.yaml"))["garminSync"]["image"]["tag"])')"
          artifacthub_sync_image_version="$(python -c 'import yaml; chart=yaml.safe_load(open("charts/wanderer/Chart.yaml")); images=yaml.safe_load(chart["annotations"]["artifacthub.io/images"]); print(next(item["image"].rsplit(":", 1)[1] for item in images if item["name"] == "Garmin synchronizer"))')"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "chart version must match MAJOR.MINOR.PATCH: $version" >&2; exit 1 ;;
          esac
          test "$version" = "$sync_image_version"
          test "$version" = "$artifacthub_sync_image_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for synchronizer image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push synchronizer image
        id: sync-image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/wanderer-garmin-sync-metadata.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/${OWNER,,}/wanderer-garmin-sync:${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --metadata-file "$metadata" \
            --push sync
          digest="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$metadata")"
          case "$digest" in
            sha256:*) ;;
            *) echo "buildx did not return an image digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package "$CHART_DIR" --destination dist --version "$VERSION"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI chart
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
        run: helm push "dist/wanderer-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign OCI chart
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.sync-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${OWNER,,}/charts/wanderer:${VERSION}"
          cosign sign --yes "ghcr.io/${OWNER,,}/wanderer-garmin-sync@${IMAGE_DIGEST}"

      - name: Create GitHub release and tag
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Release prepared version
        env:
          GITHUB_TOKEN: ${{ steps.automation-token.outputs.token }}
        run: knope release --verbose
