name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or repair
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CHART_DIR: charts/wanderer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render-test dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Run chart tests
        run: tests/render.sh

      - name: Check tag and chart version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          chart_version="$(python -c 'import yaml; print(yaml.safe_load(open("charts/wanderer/Chart.yaml"))["version"])')"
          test "$version" = "$chart_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination dist

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI chart
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
        run: helm push "dist/wanderer-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Log in to GHCR for Cosign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Sign OCI chart
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cosign sign --yes "ghcr.io/${OWNER,,}/charts/wanderer:${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" "dist/wanderer-${VERSION}.tgz" --verify-tag --generate-notes
