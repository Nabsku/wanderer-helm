name: Kind Garmin integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "examples/values-garmin-sync.yaml"
      - "sync/**"
      - "tests/kind/**"
      - "tests/sync/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "examples/values-garmin-sync.yaml"
      - "sync/**"
      - "tests/kind/**"
      - "tests/sync/**"

permissions:
  contents: read

jobs:
  kind-garmin:
    name: Kind Garmin synchronizer
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: wanderer-garmin-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Kind
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.31.4
          cluster_name: wanderer-garmin-ci
          wait: 180s

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Run Garmin synchronizer integration
        run: tests/kind/garmin-e2e.sh

      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name "$KIND_CLUSTER_NAME" || true
