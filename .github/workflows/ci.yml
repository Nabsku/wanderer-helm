name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render-test dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Install synchronizer dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r sync/requirements.txt

      - name: Run synchronizer unit tests
        env:
          PYTHONPATH: sync
        run: python -m unittest discover -s tests/sync -v

      - name: Run automation unit tests
        run: python -m unittest discover -s tests -p 'test_update_wanderer_upstream.py' -v

      - name: Validate automation configuration
        run: |
          python -m json.tool renovate.json >/dev/null
          knope --validate

      - name: Build synchronizer image
        run: docker build --tag wanderer-garmin-sync:test sync

      - name: Run chart tests
        run: tests/render.sh

      - name: Validate production manifests
        run: |
          set -euo pipefail
          helm template wanderer charts/wanderer \
            --namespace wanderer \
            --values examples/values-production.yaml \
            --set-string "secret.pocketbaseEncryptionKey=$(printf '%032d' 0)" \
            --set-string "secret.meiliMasterKey=$(printf '%048d' 0)" \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -kubernetes-version 1.25.0

      - name: Validate NetworkPolicy manifests
        run: |
          set -euo pipefail
          helm template wanderer charts/wanderer \
            --namespace wanderer \
            --values examples/values-networkpolicy.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -kubernetes-version 1.25.0

      - name: Validate Garmin synchronizer manifests
        run: |
          set -euo pipefail
          helm template wanderer charts/wanderer \
            --namespace wanderer \
            --values examples/values-garmin-sync.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -kubernetes-version 1.25.0
